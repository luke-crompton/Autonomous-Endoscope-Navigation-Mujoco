# Parameters for the deployment control loop.
#
# Load with:  ros2 run scope_control policy_node --ros-args --params-file <this>
# or via the launch file (once it exists). `/**` applies to the node whatever
# namespace it is pushed into (the launch file puts it under /scope).

/**:
  ros__parameters:

    # ---- trained-checkpoint contract -------------------------------------
    experiment: "v8_p1_v1"

    # Directory containing sf_encoder.py (the custom encoder the checkpoint was
    # trained with). On the WSL mirror:
    nav_code_dir: "/home/lukec/mujoco_v3/navigation/v8_p1"

    # Point at EITHER a checkpoint_p0 folder / a specific best_*.pth
    # (checkpoint_dir), OR a directory that contains runs_sf/ (checkpoint_root).
    # checkpoint_dir wins if both are set.
    checkpoint_dir: ""
    checkpoint_root: "/home/lukec/mujoco_v3/navigation/v8_p1"

    device: "cpu"           # the net is tiny; CPU is deliberate (see policy_runner.py)
    mock_policy: false       # true -> emit zero actions, skip torch/SF (bench bring-up)

    # ---- observation geometry (MUST match the trained env) --------------
    depth_height: 54
    depth_width: 96
    state_dim: 6

    # ---- PD command shaper --------------------------------------------
    # Fitted at 25 Hz by navigation/v9/diagnostics/pd_rate_rescale.py.
    # A x4 arithmetic rescale is UNSTABLE (|z| = 1.337). Do not touch without
    # re-fitting against the wall-clock step response.
    pd_kp: 0.1803
    pd_kd: 0.0475

    # MAX_PULL is NOT here -- policy_node runs the shaper normalised. The real
    # (asymmetric) encoder limits live in the scope_link section below and are
    # pushed to the firmware.

    # ---- runtime -----------------------------------------------------
    control_rate_hz: 25.0       # nominal only; the loop is depth-frame-driven
    tip_contact_default: false   # value used until the first telemetry message
    start_running: false         # false -> wait for a RUN/RESET on /scope/run_state

    # ================================================================
    # scope_link (serial bridge to the ESP32-S3). Unknown-to-a-node keys
    # in a '/**' block are ignored, so policy_node ignores these and
    # scope_link ignores the policy keys above.
    # ================================================================
    port: "/dev/ttyUSB0"         # CP2102 "UART" jack, forwarded into WSL via usbipd
    baud: 921600
    reconnect_period_s: 1.0
    enable_on_connect: false      # false -> firmware boots in SAFE_HOLD, send ScopeCommand ENABLE

    # Safety governor limits, pushed to the firmware on every connect.
    # These are the tunables -- raise/lower without reflashing.
    current_limit_ma: 800.0       # per-servo present current; over this (debounced) -> SAFE_HOLD
    tension_limit_g: 250.0        # per-cable tension; over this (debounced) -> SAFE_HOLD
    spike_debounce_ms: 20         # how long a spike must persist before it trips
    comms_timeout_ms: 120         # no setpoint for this long -> firmware SAFE_HOLD
    motor_hz: 200                 # servo goal-streaming rate inside the firmware
    telem_hz: 50                  # telemetry report rate

    # Asymmetric per-axis-per-direction bend limits, encoder ticks.
    # Measured 2026-09-09 with `bend <x|z>` (tip free, out of housing) --
    # hardware/bringup/measured_constants.md. Firmware maps the normalised
    # command -1..+1 to ticks with these. +x = pull servo 1, -x = servo 3;
    # +z = pull servo 2, -z = servo 4.
    maxpull_x_pos_ticks: 724      # 63.63 deg
    maxpull_x_neg_ticks: 681      # 59.85 deg
    maxpull_z_pos_ticks: 840      # 73.83 deg
    maxpull_z_neg_ticks: 603      # 53.00 deg
    maxpull_headroom: 0.9         # drive only this fraction (friction in the housing/colon)
